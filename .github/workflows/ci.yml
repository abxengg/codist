name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags "grammar_subset grammar_subset_java" ./...
      - name: Test
        run: go test -tags "grammar_subset grammar_subset_java" ./...

  # Behaviour runs are confined with bwrap on Linux; the Mac's sandbox-exec is tested on every Mac test run.
  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 23.10 and later restrict user namespaces through AppArmor, which stops bwrap. Codist then runs the
          # code unconfined and says so; this test needs bwrap to work, so it lifts the restriction for the runner.
          bwrap --ro-bind / / true || { sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 && bwrap --ro-bind / / true; }
      - name: Confined code cannot read the home folder, write outside its folder or reach the network
        run: CODIST_REQUIRE_SANDBOX=1 go test -run TestConfined -v github.com/abxengg/codist-behaviour

  install-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install with install.sh
        run: CODIST_FROM_SOURCE=1 CODIST_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      - name: Run it
        run: |
          "$RUNNER_TEMP/bin/codist" help
          "$RUNNER_TEMP/bin/codist" doctor . || true

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install with install.ps1
        shell: pwsh
        run: |
          $env:CODIST_FROM_SOURCE = '1'
          $env:CODIST_BIN_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1
      - name: Run it
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\bin\codist.exe" help
          & "$env:RUNNER_TEMP\bin\codist.exe" doctor . ; exit 0

  dev-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up every repository (Linux)
        if: runner.os != 'Windows'
        run: sh scripts/dev-setup.sh "$RUNNER_TEMP/dev" && cd "$RUNNER_TEMP/dev/codist" && go build -tags "grammar_subset grammar_subset_java" ./...
      - name: Set up every repository (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/dev-setup.ps1 "$env:RUNNER_TEMP\dev"
          go build -tags "grammar_subset grammar_subset_java" ./...
